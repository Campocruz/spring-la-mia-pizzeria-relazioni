<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Home Page</title>
</head>

<body>

  <header>
    <div th:insert="~{ fragments/fragments :: navbar(page='pizzaDetail') }" />
  </header>

  <main>
    <div class="container">
      <div class="row mt-3" th:object="${pizza}">
        <div class="col-4">
          <img src="https://picsum.photos/300/300" class="card-img-top" alt="https://picsum.photos/200/200">
        </div>
        <div class="col-8">
          <section class="d-flex justify-content-between">
            <h2 th:text="*{name}" />
            <form class="d-flex justify-content-around" method="post" th:action="@{/pizze/delete/{id}(id=*{id})}">
              <a class="btn btn-primary m-1" th:href="@{/pizze/edit/{id}(id=*{id})}">
                Modifica
              </a>
              <button class="btn btn-danger m-1" type="submit">Elimina</button>
            </form>
          </section>

          <hr>

          <section>
            <h3>Description:</h3>
            <ul class="">
              <li class="text-start" th:text="|Ingredienti: *{description}|" />
              <li class="text-start" th:text="|Listino: *{price} &euro;|" />
            </ul>
          </section>


          <hr>

          <section>
            <div class="d-flex justify-content-around">
              <h3>Offerte in corso</h3>
              <a class="btn btn-secondary" th:href="@{/pizze/{id}/offers(id=*{id})}">
                Nuova
              </a>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th>Titolo</th>
                  <th>Descrizione</th>
                  <th>Sconto in %</th>
                  <th>Data Inizio</th>
                  <th>Data Fine</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="offer : *{offers}" th:object="${offer}">
                  <td>[[*{title}]]</td>
                  <td>[[*{description}]]</td>
                  <td>[[*{rate}]]</td>
                  <td>[[*{startOffer}]]</td>
                  <td>[[*{endOffer}]]</td>
                  <td>
                    <a type="button" class="btn btn-secondary btn-sm" th:href="...">Modifica</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
