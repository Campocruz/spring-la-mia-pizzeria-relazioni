<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Edit or Create Offer</title>
</head>

<body>

  <header>
    <div th:insert="~{ fragments/fragments :: navbar }" />
  </header>

  <main>
    <div class="container">

      <section>
        <div class="row mt-3">
          <h1>Crea offerta per la pizza </h1>
        </div>
      </section>

      <section>
        <form th:action="@{/offers/create}" method="post">
          <div class="row" th:object="${offer}">
            <div class="col-12">
              <label for="title">Titolo Offerta</label>
              <input id="title" type="text" class="form-control" th:field="*{title}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}">
                <ul>
                  <li th:each="error : ${#fields.errors('title')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <label for="description">Descrizione Offerta</label>
              <input id="description" type="text" class="form-control" th:field="*{description}"
                th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                <ul>
                  <li th:each="error : ${#fields.errors('description')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <label for="rate">Sconto</label>
              <input id="rate" type="number" class="form-control" th:field="*{rate}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('rate')}">
                <ul>
                  <li th:each="error : ${#fields.errors('rate')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <label for="startOffer">Inizio Offerta</label>
              <input id="startOffer" type="date" class="form-control" th:field="*{startOffer}"
                th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('startOffer')}">
                <ul>
                  <li th:each="error : ${#fields.errors('startOffer')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <label for="endOffer">Fine Offerta</label>
              <input id="endOffer" type="date" class="form-control" th:field="*{endOffer}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('endOffer')}">
                <ul>
                  <li th:each="error : ${#fields.errors('endOffer')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Crea</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
